[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-harness"
version = "0.2.0.dev0"
description = "Codex-first deterministic trading research and execution harness"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "JawnDiego"}]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
mcp = ["mcp==2.0.0"]
execution = [
  "hyperliquid-python-sdk==0.24.0",
  "eth-account==0.13.7",
  "eth-abi==6.0.0",
  "eth-hash==0.8.0",
  "eth-keyfile==0.8.1",
  "eth-keys==0.8.0",
  "eth-rlp==3.0.0",
  "eth-typing==6.0.0",
  "eth-utils==5.3.1",
  "hexbytes==2.0.0",
  "msgpack==1.2.1",
  "bitarray==3.10.1",
  "ckzg==2.1.8",
  "cytoolz==1.1.0",
  "parsimonious==0.10.0",
  "pycryptodome==3.23.0",
  "rlp==5.0.0",
  "toolz==1.1.0",
]

[project.scripts]
trading-harness = "trading_harness.cli:main"
trading-harness-mcp = "trading_harness.mcp_server:main"
trading-harness-testnet-chat-mcp = "trading_harness.testnet_chat_mcp:main"
trading-harness-testnet-chat-broker = "trading_harness.testnet_chat_broker_service:main"
trading-harness-testnet-chat-collector = "trading_harness.testnet_chat_collector_service:main"
trading-harness-testnet-chat-register = "trading_harness.executor_chat_registration_service:main"
trading-harness-executor = "trading_harness.executor_cli:main"
trading-harness-qualification = "trading_harness.qualification_cli:main"
trading-harness-route-health-collector = "trading_harness.testnet_route_health_collector:main"
trading-harness-remote-vpn-health-collector = "trading_harness.testnet_remote_vpn_health_collector:main"
trading-desk-testnet-remote-vpn-sample = "trading_harness.testnet_remote_vpn_observation_helpers:sample_main"
trading-desk-testnet-remote-vpn-probe = "trading_harness.testnet_remote_vpn_observation_helpers:probe_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_harness*"]
namespaces = true
